<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cinzas do Éter — JRPG 16-bit original" />
    <title>Cinzas do Éter</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game-container"></div>
    <div id="debug-controls" style="position: absolute; bottom: 8px; right: 8px; display: flex; flex-wrap: wrap; max-width: 460px; gap: 4px; z-index: 1000; font-family: monospace;">
      <button id="btn-approach-torvak" style="background: #1A0F2E; color: #7DE8F0; border: 1px solid #2E9AA5; padding: 4px 6px; font-size: 10px; cursor: pointer;">Ir Torvak</button>
      <button id="btn-talk-torvak" style="background: #1A0F2E; color: #E8C876; border: 1px solid #6B3FA0; padding: 4px 6px; font-size: 10px; cursor: pointer;">Falar Torvak</button>
      <button id="btn-goto-plains" style="background: #2A1F3D; color: #9B9286; border: 1px solid #6B3FA0; padding: 4px 6px; font-size: 10px; cursor: pointer;">→ Planície</button>
      <button id="btn-goto-village" style="background: #2A1F3D; color: #E8C876; border: 1px solid #D4A24E; padding: 4px 6px; font-size: 10px; cursor: pointer;">← Vila</button>
      <button id="btn-goto-cave" style="background: #0A0612; color: #7DE8F0; border: 1px solid #4A2875; padding: 4px 6px; font-size: 10px; cursor: pointer;">→ Caverna</button>
      <button id="btn-advance-z" style="background: #1A0F2E; color: #FFE4A0; border: 1px solid #E8C876; padding: 4px 6px; font-size: 10px; cursor: pointer;">[Z] Interagir/Comprar</button>
      <button id="btn-cancel-x" style="background: #1A0F2E; color: #FFE4A0; border: 1px solid #E8C876; padding: 4px 6px; font-size: 10px; cursor: pointer;">[X] Sair</button>
      <button id="btn-menu-m" style="background: #1A0F2E; color: #7DE8F0; border: 1px solid #6B3FA0; padding: 4px 6px; font-size: 10px; cursor: pointer;">[M] Status</button>
      <button id="btn-inventory-i" style="background: #1A0F2E; color: #FFE4A0; border: 1px solid #7DE8F0; padding: 4px 6px; font-size: 10px; cursor: pointer;">[I] Inventário</button>
      <button id="btn-escape" style="background: #1A0F2E; color: #FFE4A0; border: 1px solid #6B3FA0; padding: 4px 6px; font-size: 10px; cursor: pointer;">[ESC]</button>
      <button id="btn-down" style="background: #1A0F2E; color: #E8C876; border: 1px solid #6B3FA0; padding: 4px 6px; font-size: 10px; cursor: pointer;">[↓] Item/Slot</button>
      <button id="btn-up" style="background: #1A0F2E; color: #E8C876; border: 1px solid #6B3FA0; padding: 4px 6px; font-size: 10px; cursor: pointer;">[↑] Item/Slot</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
